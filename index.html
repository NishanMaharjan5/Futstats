<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FutStats — Match Analytics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div id="error" class="error" hidden></div>

    <!-- 1. Header -->
    <header>
      <div class="brand">
        <div class="mark">F</div>
        <div class="wordmark">Fut<span>Stats</span></div>
      </div>
      <div class="match-meta">
        <div class="teams" id="match-teams">—</div>
        <div class="sub" id="match-sub">—</div>
      </div>
    </header>

    <!-- 2. Hero: annotated video + possession -->
    <section class="hero">
      <div class="card video-card">
        <div class="card-title">Match replay</div>
        <div id="video-media" class="video-media"></div>
        <div class="video-caption">
          Annotated demo — placeholder poster shows until you add
          <code>assets/annotated_demo.mp4</code>.
        </div>
      </div>
      <div class="card possession-card" id="possession"></div>
    </section>

    <!-- 3. Stat cards row -->
    <section class="tiles" id="tiles"></section>

    <!-- 4. Player table -->
    <section class="card table-card">
      <div class="card-title">Player stats</div>
      <div class="table-scroll">
        <table id="players">
          <thead>
            <tr>
              <th class="sortable" data-key="id">Player</th>
              <th class="sortable" data-key="team">Team</th>
              <th class="sortable num" data-key="touches">Touches</th>
              <th class="sortable num" data-key="passes">Passes</th>
              <th class="sortable num" data-key="turnovers">Turnovers</th>
              <th class="sortable num" data-key="rating">Rating</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 5. Visuals grid -->
    <section class="visuals" id="visuals"></section>

    <!-- 6. Footer -->
    <footer>
      <span>FutStats · futsal match analytics</span>
      <a href="https://github.com/NishanMaharjan5/Futstats" target="_blank" rel="noopener">GitHub ↗</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
