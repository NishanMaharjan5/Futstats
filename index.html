<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FutStats — Match Analytics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div id="error" class="error" hidden></div>

    <!-- 1. Header -->
    <header>
      <div class="brand">
        <img src="assets/FutStats_Logo.png" alt="FutStats Logo" class="brand-logo">
        <div class="brand-text">
          <div class="wordmark">Fut<span>Stats</span></div>
          <div class="brand-tagline">PLAY. ANALYZE. IMPROVE.</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <span class="theme-label">Dark</span>
        </button>
        <div class="match-meta">
          <div class="teams" id="match-teams">—</div>
          <div class="sub" id="match-sub">—</div>
        </div>
      </div>
    </header>

    <!-- 2. Hero: annotated video + possession -->
    <section class="hero">
      <div class="card video-card">
        <div class="card-title">Match replay</div>
        <div id="video-media" class="video-media"></div>
        <div class="video-caption">
          Annotated demo — placeholder poster shows until you add
          <code>assets/annotated_demo.mp4</code>.
        </div>
      </div>
      <div class="card possession-card" id="possession"></div>
    </section>

    <!-- 3. Stat cards row -->
    <section class="tiles" id="tiles"></section>

    <!-- 4. Player table -->
    <section class="card table-card">
      <div class="card-title">Player stats</div>
      <div class="table-scroll">
        <table id="players">
          <thead>
            <tr>
              <th class="sortable" data-key="id">Player</th>
              <th class="sortable" data-key="team">Team</th>
              <th class="sortable num" data-key="touches">Touches</th>
              <th class="sortable num" data-key="passes">Passes</th>
              <th class="sortable num" data-key="turnovers">Turnovers</th>
              <th class="sortable num" data-key="rating">Rating</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 5. Visuals grid -->
    <section class="visuals" id="visuals"></section>

    <!-- 6. Footer -->
    <footer>
      <span>FutStats · futsal match analytics</span>
      <a href="https://github.com/NishanMaharjan5/Futstats" target="_blank" rel="noopener">GitHub ↗</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
